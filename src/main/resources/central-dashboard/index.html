<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaghettiChef Central</title>
  <link rel="icon" type="image/svg+xml" href="/central-dashboard/favicon.svg">
  <link rel="stylesheet" href="/central-dashboard/central-dashboard.css">
</head>
<body>
  <main>
    <header class="topbar">
      <img src="/central-dashboard/favicon.svg" alt="" class="brand-logo">
      <h1>SpaghettiChef Central</h1>
    </header>
    <section>
      <h2>Farms</h2>
    <table>
      <thead>
        <tr>
          <th>Farm</th>
          <th>Status</th>
          <th>Printers</th>
          <th>Cameras</th>
          <th>Active Prints</th>
          <th>Alerts</th>
          <th>Last Seen</th>
        </tr>
      </thead>
      <tbody id="farms">
        <tr><td colspan="7">Loading...</td></tr>
      </tbody>
    </table>
    </section>
    <section>
      <h2>Replay Packages</h2>
      <div id="replays" class="replay-list">Loading...</div>
    </section>
  </main>
  <script src="/central-dashboard/central-dashboard.js"></script>
</body>
</html>
